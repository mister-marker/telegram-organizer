##########################################################
# .aider.conf.yml — конфиг для роли QA / Аудитор (Aider)
#
# ⚠️ Важное техническое ограничение, которое нужно знать:
# у Aider (проверено по официальной документации, options.html /
# aider_conf.html) НЕТ единого YAML-флага «read-only режим для всей
# сессии». auto-commits: false ниже гарантированно не даёт Aider
# коммитить сам. Но полное «только читай, не трогай файлы» —
# это дисциплина, а не техническая блокировка:
#   - не передавайте backend/frontend-файлы через --file (это делает
#     их editable) — используйте только read: ниже (read-only контекст);
#   - в самой сессии держите активным режим `/ask` (`/chat-mode ask`),
#     а не дефолтный `code` — в ask-режиме Aider обсуждает код и
#     предлагает правки текстом, но НЕ пишет их в файлы;
#   - если Aider всё-таки переключили в `/code` и он попытался
#     отредактировать файл — auto-commits: false остановит коммит,
#     но сам файл на диске он изменит. Секция 3 в AGENTS.md
#     («никогда не пишет напрямую в backend/») — это правило для
#     человека, который сидит за терминалом, а не только настройка.
#
# Источник: https://aider.chat/docs/config/aider_conf.html,
# https://aider.chat/docs/config/options.html,
# https://aider.chat/docs/usage/modes.html
##########################################################

## Модель — решение CEO от 16.08.2026 (см. docs/TASKS.md BL-04,
## docs/HANDOFF.md): после истечения free-тарифа kimi-k3-free (31.08.2026)
## роль QA переходит на ПЛАТНУЮ модель того же семейства, а не деградирует
## до ручного аудита. На дату этого решения актуальные платные варианты
## Kimi K2 на OpenRouter — K2.5 (~$0.375/$2.03 за млн input/output токенов,
## самый дешёвый в линейке) и K2.6 (~$0.54/$2.28). Для роли QA (в основном
## чтение + текстовые предложения, не тяжёлая генерация) K2.5 — разумный
## выбор по цене. Точный слаг и актуальную цену проверьте в OpenRouter
## перед переключением — линейка обновляется, к 31.08 могут быть новее
## версии.
model: openrouter/moonshotai/kimi-k2:free  # TODO 31.08.2026: переключить на openrouter/moonshotai/kimi-k2.5 (или актуальную платную версию) — до этой даты можно оставаться на free-тарифе

## Не даём Aider коммитить самостоятельно — коммитит только CEO
## (см. AGENTS.md §3, «Кто коммитит»).
auto-commits: false
dirty-commits: false

## Не даём Aider автоматически говорить "да" за пользователя —
## каждое подтверждение (в том числе принятие правки) — вручную.
yes-always: false

## Файлы, которые Aider читает по умолчанию как read-only контекст
## при каждом запуске — конституция + продуктовый и архитектурный
## контекст, без которого предложения будут «мимо» проекта.
read:
  - AGENTS.md
  - docs/PRD.md
  - docs/ARCHITECTURE.md
  - docs/SECURITY.md
  - docs/API_CONTRACT.md

## Показывать diff предлагаемых изменений явно — вам нужно видеть,
## что именно предлагается, прежде чем нести это Codex.
show-diffs: true

## Verbose — полезно на старте, чтобы понимать, что Aider реально
## делает; можно выключить позже.
verbose: false

## git: true — Aider должен видеть репозиторий, чтобы строить repo-map
## и находить контекст, но это не даёт ему прав на запись без /code.
git: true
